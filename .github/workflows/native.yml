name: Native builds

# Produces installable artifacts without needing a Mac on the desk:
# an Android APK on every push, and an unsigned iOS archive on demand.
# Signing and store upload stay manual on purpose — they need secrets and
# an Apple Developer account, and neither belongs in a branch build.

on:
  push:
    branches: [dev/app]
  pull_request:
    branches: [main, dev/app]
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # the suites drive a real browser, so one has to be present
      - run: npx playwright install --with-deps chromium
      - name: Whole suite
        run: |
          node test/smoke.js
          node test/age-gate.js
          node test/delete-account.js
          node test/privacy.js
          node test/native.js

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - name: Stage the web app and sync
        run: npm run sync:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # A release build needs a keystore. Skipped unless the secrets exist, so
      # the workflow still succeeds on a fork or before signing is set up.
      - name: Is a signing key configured?
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "ready=${KEYSTORE:+yes}" >> "$GITHUB_OUTPUT"

      - name: Build release bundle
        if: steps.signing.outputs.ready == 'yes'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - uses: actions/upload-artifact@v4
        with:
          name: codecraft-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  ios:
    name: iOS archive
    # Only on request: macOS runners cost far more minutes than ubuntu ones,
    # and nothing about the web app changes per-platform.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run sync:ios

      # Unsigned, so it cannot be installed on a device or uploaded — it is
      # here to prove the project still compiles. Signing needs the Apple
      # Developer certificates, which is a deliberate manual step.
      - name: Build (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - uses: actions/upload-artifact@v4
        with:
          name: codecraft-ios-archive
          path: ios/App/build/App.xcarchive
          if-no-files-found: warn
